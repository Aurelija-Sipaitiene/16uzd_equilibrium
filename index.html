<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <article class="card">
        <img class="card-image" src="images/image.png" alt="pagrindinis paveiksliukas" />
        <h1>Equilibrium #3429</h1>
        <p>Our Equilibrium collection promotes balance and calm.</p>
        <div class="symbols">
          <p>
            <img src="images/symbol.svg" alt="simboliukas" />
            <span class="numbers">0.041 ETH</span>
          </p>
          <p><span aria-hidden="true">◷</span> 3 days left</p>
        </div>
        <hr />
        <div class="creation">
          <img src="images/face.webp" alt="Jules Wyvern" />
          <p>Creation of <span class="name">Jules Wyvern</span></p>
        </div>
        </article>
    </main>
  </body>
</html>
